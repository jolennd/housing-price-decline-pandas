# Dependabot version updates: one grouped PR per month for routine bumps.
# Security fixes are separate (Dependabot security updates) and arrive immediately.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
